name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push waits. Canceling would interrupt a migration on the host.
concurrency:
  group: lightsail-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Lightsail
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::Set LIGHTSAIL_HOST and LIGHTSAIL_SSH_KEY repository secrets."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          printf '%s %s\n' "$HOST" "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOzzG3jz+3RUJ1B+1HUSAGSL4y2sab7dsfA7QOXnwFJb" > ~/.ssh/known_hosts
          tr -d '\r' < deploy/lightsail.sh | ssh -i ~/.ssh/lightsail.pem -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o StrictHostKeyChecking=yes "ubuntu@${HOST}" bash -s
