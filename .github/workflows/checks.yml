name: Checks
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env: {NEXT_TELEMETRY_DISABLED: "1"}
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumi_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: lumi_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U lumi_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e './backend[test]'
      - run: python -m pytest backend/tests -q
      - run: python -m alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://lumi_test:test_only@localhost:5432/lumi_test
      - run: python -m alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: postgresql+asyncpg://lumi_test:test_only@localhost:5432/lumi_test
      - run: python -m pytest backend/tests -q
        env:
          LUMI_TEST_DATABASE_URL: postgresql+asyncpg://lumi_test:test_only@localhost:5432/lumi_test
