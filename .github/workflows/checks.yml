name: Checks
on:
  push:
    branches-ignore: [dev, main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: lumi-backend-check
          cache-from: type=gha,scope=aws-backend
          cache-to: type=gha,mode=max,scope=aws-backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lumi-frontend-check
          build-args: PYTHON_API_URL=http://127.0.0.1:8000
          cache-from: type=gha,scope=aws-frontend
          cache-to: type=gha,mode=max,scope=aws-frontend
      - name: Smoke test images sharing the ECS network layout
        shell: bash
        run: |
          docker run -d --name backend-check \
            -e DATABASE_URL=sqlite+aiosqlite:////data/check.db \
            -p 127.0.0.1:8000:8000 -p 127.0.0.1:3000:3000 lumi-backend-check
          docker run -d --name frontend-check --network container:backend-check lumi-frontend-check
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null http://127.0.0.1:3000/welcome
          curl --fail --output /dev/null http://127.0.0.1:3000/characters/kaito-kid.webp
          curl --fail --output /dev/null http://127.0.0.1:3000/api/v1/characters
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs backend-check || true
          docker logs frontend-check || true
      - name: Clean up smoke test
        if: always()
        run: docker rm -f frontend-check backend-check || true
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install cfn-lint==1.57.2
      - run: cfn-lint deploy/aws/stack.yaml
      - run: python -m unittest discover -s scripts/tests -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: {NEXT_TELEMETRY_DISABLED: "1"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install audio tools for STT browser tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.13.0', enable-cache: true, cache-dependency-glob: backend/uv.lock}
      - run: uv sync --locked --extra test --python 3.12 --directory backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-test-results, path: test-results, retention-days: 7}
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumi_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: lumi_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U lumi_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.13.0', enable-cache: true, cache-dependency-glob: backend/uv.lock}
      - run: uv sync --locked --extra test --python 3.12 --directory backend
      - run: backend/.venv/bin/python -m pytest backend/tests -q
      - run: backend/.venv/bin/python -m alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://lumi_test:test_only@localhost:5432/lumi_test
      - run: backend/.venv/bin/python -m alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: postgresql+asyncpg://lumi_test:test_only@localhost:5432/lumi_test
      - run: backend/.venv/bin/python -m pytest backend/tests -q
        env:
          LUMI_TEST_DATABASE_URL: postgresql+asyncpg://lumi_test:test_only@localhost:5432/lumi_test
