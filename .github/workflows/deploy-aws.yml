name: Deploy dev to AWS
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecs-dev
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate AWS configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN AWS_STACK_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Set repository Actions variable ${name}; see deploy/aws/README.md."
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read stack outputs
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$AWS_STACK_NAME" --query 'Stacks[0].Outputs' --output json > "$RUNNER_TEMP/lumi-stack-outputs.json"
          for mapping in FRONTEND_REPOSITORY:FrontendRepositoryUri BACKEND_REPOSITORY:BackendRepositoryUri ECS_CLUSTER:ClusterName ECS_SERVICE:ServiceName ECS_TASK_DEFINITION:TaskDefinitionArn ECS_SUBNETS:PrivateSubnetIds ECS_SECURITY_GROUP:TaskSecurityGroupId; do
            value=$(jq -er --arg key "${mapping#*:}" '.[] | select(.OutputKey == $key) | .OutputValue | select(length > 0)' "$RUNNER_TEMP/lumi-stack-outputs.json")
            printf '%s=%s\n' "${mapping%%:*}" "$value" >> "$GITHUB_ENV"
          done
          echo "IMAGE_TAG=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: PYTHON_API_URL=http://127.0.0.1:8000
          cache-from: type=gha,scope=aws-frontend
          cache-to: type=gha,mode=max,scope=aws-frontend
      - name: Build backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=aws-backend
          cache-to: type=gha,mode=max,scope=aws-backend
      - name: Migrate and deploy the verified image pair
        env:
          FRONTEND_IMAGE: ${{ env.FRONTEND_REPOSITORY }}@${{ steps.frontend.outputs.digest }}
          BACKEND_IMAGE: ${{ env.BACKEND_REPOSITORY }}@${{ steps.backend.outputs.digest }}
        run: python scripts/deploy_ecs.py
