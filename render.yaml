# Deploy through New > Blueprint, selecting the render-deploy branch.
services:
  - type: web
    name: personax-demo
    runtime: docker
    plan: free
    region: singapore
    branch: render-deploy
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: render-demo
      - key: AUTO_MIGRATE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: personax-demo-db
          property: connectionString
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: DEMO_OWNER_PASSWORD
        generateValue: true
      - key: DEMO_OWNER_EMAIL
        value: demo-owner@example.com
      - key: SEPAY_ENV
        value: test

databases:
  - name: personax-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: personax_demo
    user: personax_demo
    ipAllowList: []
