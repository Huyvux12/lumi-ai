[project]
name = "lumi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<0.143", "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy[asyncio]>=2.1,<2.2", "alembic>=1.20,<1.21", "asyncpg>=0.31,<0.32",
  "aiosqlite>=0.22,<0.23", "httpx[socks]>=0.28,<0.29", "argon2-cffi>=25,<26",
  "python-dotenv>=1,<2", "python-multipart>=0.0.32,<0.1", "email-validator>=2.3,<3",
  "tokenizers>=0.22,<0.23", "google-auth>=2.40,<3", "requests>=2.32,<3",
  "python-dateutil>=2.9,<3", "redis>=8,<9", "cryptography>=46",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.14"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"


[tool.setuptools.package-data]
app = ["seed/*.json", "seed/*.txt"]
